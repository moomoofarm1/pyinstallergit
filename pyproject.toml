[project]
name = "alf-audio-processing"
version = "0.2.0"
description = "Advanced Audio Label Frontend with diarization and transcription pipelines"
requires-python = ">=3.9"

# Minimal dependencies for GUI-only package
dependencies = [
  # Core GUI dependencies only
  "pathlib2>=2.3.7",
  "requests>=2.31.0",
  "pydantic>=2.0.0",
  
  # Audio processing (basic)
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "pydub>=0.25.1",
  "scipy>=1.11.0",
  "numpy>=1.24.0",
  "psutil>=5.9.0",  # process monitoring
  
  # PyInstaller for building
  "pyinstaller>=6.3",
  
  # uv package manager (will be bundled)
  "uv>=0.1.0",
]

[project.optional-dependencies]
# Full dependencies (for development only, not included in exe)
full = [
  # Web frameworks (installed dynamically by uv)
  "fastapi[standard]>=0.100.0",
  "uvicorn>=0.23.0",
  
  # ML frameworks (installed dynamically by uv)
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "transformers>=4.30.0",
  
  # Label Studio integration (installed dynamically by uv)
  "label-studio>=1.9.0",
  "label-studio-ml>=1.0.9",
  "label-studio-sdk>=0.0.32",
  
  # Diarization (installed dynamically by uv)
  "pyannote.audio>=3.0.0",
  "pyannote.core>=5.0.0",
  
  # NeMo ASR (installed dynamically by uv)
  "nemo-toolkit[asr]>=1.20.0",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.0",
]

dev = [
  # Development tools
  "black>=23.0.0",
  "ruff>=0.0.280",
  "mypy>=1.5.0",
  "pre-commit>=3.3.0",
  
  # Testing
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
]

build = [
  # Build tools
  "pyinstaller>=6.3",
  "pyinstaller-hooks-contrib>=2024.0",
]

[tool.pyinstaller]
# PyInstaller configuration
name = "ALF-AudioProcessing"
console = false
windowed = true
onefile = true
icon = "assets/alf_icon.ico"

[tool.uv]
# UV configuration for development
dev-dependencies = [
  "pytest>=7.4.0",
  "black>=23.0.0",
  "ruff>=0.0.280",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"