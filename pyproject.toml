[project]
name = "alf-audio-processing"
version = "0.2.0"
description = "Advanced Audio Label Frontend with diarization and transcription pipelines"
requires-python = ">=3.9"

dependencies = [
  # Core dependencies
  "fastapi[standard]>=0.100.0",
  "uvicorn>=0.23.0",
  "requests>=2.31.0",
  "pathlib2>=2.3.7",
  
  # Audio processing
  "librosa>=0.10.0",
  "soundfile>=0.12.0",
  "pydub>=0.25.1",
  "scipy>=1.11.0",
  
  # ML backends
  "torch>=2.0.0",
  "torchaudio>=2.0.0",
  "transformers>=4.30.0",
  
  # Label Studio integration
  "label-studio>=1.9.0",
  "label-studio-ml>=1.0.9",
  "label-studio-sdk>=0.0.32",
  
  # Diarization (pyannote.audio)
  "pyannote.audio>=3.0.0",
  "pyannote.core>=5.0.0",
  
  # NeMo ASR for transcription
  "nemo-toolkit[asr]>=1.20.0",
  
  # Testing and utilities
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "rich>=13.5.0",
  "typer>=0.9.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "black>=23.0.0",
  "ruff>=0.0.280",
  "mypy>=1.5.0",
  "pre-commit>=3.3.0",
]

diarization = [
  "pyannote.audio>=3.0.0",
  "pyannote.core>=5.0.0",
  "pyannote.database>=5.0.0",
]

transcription = [
  "nemo-toolkit[asr]>=1.20.0",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.0",
]

[tool.uv]
# defaults are fine
